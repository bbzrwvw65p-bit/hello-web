name: Precios de Apple

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Leer Apple Reacondicionado en España
        run: python3 scripts/fetch_observations.py
      - name: Commit si el JSON cambia
        id: commit
        run: |
          if git diff --quiet -- src/data/market/observations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en los precios."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/market/observations.json
            git commit -m "Actualiza los precios de Apple Reacondicionado en España"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests y export estático
        if: steps.commit.outputs.changed == 'true'
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPO" = "$OWNER.github.io" ]; then
            export NEXT_PUBLIC_BASE_PATH=
          else
            export NEXT_PUBLIC_BASE_PATH="/$REPO"
          fi
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: out

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
